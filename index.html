<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teyo IA</title>
  <style>
    body {
      margin: 0; height: 100vh; background: #0f0f0f; color: #fff;
      font-family: sans-serif; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; padding: 20px;
    }
    .spinner {
      width: 38px; height: 38px; border: 3px solid #333; border-top-color: #ff7b00;
      border-radius: 50%; animation: girar 0.8s linear infinite; margin-bottom: 16px;
    }
    @keyframes girar { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p id="msg">Conectando con Teyo IA...</p>

  <script>
    async function buscarYConectar() {
      const msg = document.getElementById("msg");
      try {
        const res = await fetch("url.txt?t=" + Date.now(), { cache: "no-store" });
        if (res.ok) {
          const link = (await res.text()).trim();
          if (link.startsWith("https://")) {
            msg.innerText = "Abriendo Teyo IA...";
            window.location.replace(link);
            return;
          }
        }
        msg.innerText = "Esperando link de Termux...";
      } catch (e) {
        msg.innerText = "Sin señal. Reintentando...";
      }
      setTimeout(buscarYConectar, 3000);
    }
    buscarYConectar();
  </script>
</body>
</html>
