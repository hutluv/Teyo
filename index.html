<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teyo</title>
  <style>
    body {
      margin: 0; height: 100vh; background: #0a0a0c; color: #e4e4e7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }
    .pulso {
      width: 14px; height: 14px; border-radius: 50%; background: #a855f7;
      box-shadow: 0 0 18px #a855f7; animation: latir 1.4s infinite ease-in-out; margin-bottom: 18px;
    }
    @keyframes latir {
      0%, 100% { transform: scale(0.85); opacity: 0.6; }
      50% { transform: scale(1.25); opacity: 1; }
    }
    p { font-size: 16px; font-weight: 500; letter-spacing: 0.3px; color: #d4d4d8; }
  </style>
</head>
<body>
  <div class="pulso"></div>
  <p id="msg">Teyo está esperando para hablar...</p>

  <script>
    async function buscarYConectar() {
      const msg = document.getElementById("msg");
      try {
        const res = await fetch("url.txt?t=" + Date.now(), { cache: "no-store" });
        if (res.ok) {
          const link = (await res.text()).trim();
          if (link.startsWith("https://")) {
            window.location.replace(link);
            return;
          }
        }
      } catch (e) {}
      setTimeout(buscarYConectar, 2500);
    }
    buscarYConectar();
  </script>
</body>
</html>
