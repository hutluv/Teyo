<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teyo IA</title>
  <style>
    body {
      margin: 0; height: 100vh; background: #0f0f0f; color: #fff;
      font-family: sans-serif; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; padding: 20px;
    }
    .spinner {
      width: 38px; height: 38px; border: 3px solid #333; border-top-color: #ff7b00;
      border-radius: 50%; animation: girar 0.8s linear infinite; margin-bottom: 16px;
    }
    @keyframes girar { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p id="msg">Conectando con Teyo IA...</p>

  <script>
    const CANAL = "teyo_mi_canal_99";

    async function buscarYConectar() {
      const msg = document.getElementById("msg");
      try {
        const res = await fetch(`https://ntfy.sh{CANAL}/raw?poll=1`, { cache: "no-store" });
        const texto = await res.text();
        const links = texto.split("\n").map(l => l.trim()).filter(l => l.startsWith("https://"));

        if (links.length > 0) {
          const ultimoLink = links[links.length - 1];
          msg.innerText = "Abriendo Teyo IA...";
          window.location.replace(ultimoLink);
          return;
        }
        msg.innerText = "Esperando link desde Termux...";
      } catch (e) {
        msg.innerText = "Reconectando...";
      }
      setTimeout(buscarYConectar, 3000);
    }

    buscarYConectar();
  </script>
</body>
</html>
